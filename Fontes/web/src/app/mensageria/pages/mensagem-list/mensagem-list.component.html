<po-page-list p-title="">

  <thl-page-header title="Mensageria" subtitle="Consulta de mensagens de integração · mais recentes primeiro" [lastUpdate]="lastUpdateLabel">
    <thl-search-bar
      placeholder="Filtrar os registros carregados"
      [value]="filtro.texto ?? ''"
      (search)="buscaRapida($event)"
      (advanced)="filtroAvancado.open()">
    </thl-search-bar>
  </thl-page-header>

  <po-disclaimer-group class="thl-disclaimers"
    [p-title]="disclaimerGroup.title"
    [p-disclaimers]="disclaimerGroup.disclaimers"
    (p-change)="disclaimerGroup.change!($event)">
  </po-disclaimer-group>

  <thl-stat-chips [chips]="filterChips" [equalWidth]="true" (chipClick)="onChipClick($event)"></thl-stat-chips>


  @if (erro) {
    <thl-error-state [detalhe]="erro" (retry)="tentarNovamente()"></thl-error-state>
  } @else if (items.length === 0 && !loading) {
    <thl-empty-state titulo="Nenhuma mensagem encontrada"
      descricao="Tente ajustar os filtros ou o período de busca."></thl-empty-state>
  }

  <!-- O controle é posicionado **em relação à tabela**, não ao fluxo da página: a faixa da
       engrenagem é a primeira coisa dentro do `po-table`, e ancorar aqui faz o alinhamento
       sobreviver ao disclaimer aparecer ou sumir. `min-height` reserva a faixa quando não há
       tabela, para o controle não sumir justamente quando o filtro esvaziou a lista. -->
  <div class="thl-area-tabela">
    <div class="thl-sentido" role="group" aria-label="Sentido do fluxo">
      @for (opcao of opcoesSentido; track opcao.value) {
        <button type="button" class="thl-sentido__botao"
          [class.thl-sentido__botao--ativo]="sentidoSelecionado === opcao.value"
          [attr.aria-pressed]="sentidoSelecionado === opcao.value"
          [attr.aria-label]="opcao.tooltip"
          [p-tooltip]="opcao.tooltip"
          (click)="aoMudarSentido(opcao.value)">
          <span [class]="opcao.icone" aria-hidden="true"></span>
        </button>
      }
    </div>

  @if (!erro && (items.length > 0 || loading)) {
  <po-table
    [p-columns]="columns"
    [p-items]="items"
    [p-loading]="loading"
    [p-sort]="true"
    [p-striped]="true"
    p-container
    [p-show-more-disabled]="!hasNext"
    (p-show-more)="carregarMais()"
    (p-sort-by)="onSort($event)">
    <ng-template p-table-cell-template let-row="row">
      <thl-row-actions [actions]="rowActions" [row]="row"></thl-row-actions>
    </ng-template>

    <!-- Avião junto do texto. Template de coluna em vez de `type: 'label'`: aquele viraria
         tag colorida, reservada no projeto para estado e severidade — sentido não é nenhum
         dos dois. Valor fora do domínio aparece cru, sem ícone, em vez de sumir. -->
    <ng-template p-table-column-template p-property="dispositivo" let-value>
      <span class="thl-dispositivo">
        @if (value === 'Saida' || value === 'Entrada') {
          <span class="an" [class.an-airplane-takeoff]="value === 'Saida'"
            [class.an-airplane-landing]="value === 'Entrada'" aria-hidden="true"></span>
        }
        {{ value === 'Saida' ? 'Saída' : value }}
      </span>
    </ng-template>
  </po-table>
  }
  </div>

</po-page-list>

<app-mensagem-filtro-avancado #filtroAvancado
  (filtrar)="onFiltroAvancado($event)">
</app-mensagem-filtro-avancado>

<app-message-detail-modal #messageDetailModal>
</app-message-detail-modal>
